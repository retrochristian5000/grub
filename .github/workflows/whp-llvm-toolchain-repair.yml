name: WHP LLVM target toolchain repair

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/whp-llvm-toolchain-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out GRUB
        uses: actions/checkout@v4

      - name: Apply LLVM target toolchain support
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('configure.ac')
          text = path.read_text()
          needle = '''#
          # Check for target programs.
          #

          # Find tools for the target.
          '''
          replacement = '''#
          # Select the target toolchain family.  "auto" preserves the historical
          # GNU-style discovery.  "llvm" makes Clang, LLD, and LLVM binutils one
          # coherent target producer while retaining explicit TARGET_* overrides.
          #
          AC_ARG_WITH([target-toolchain],
            [AS_HELP_STRING([--with-target-toolchain=TOOLCHAIN],
              [select target toolchain family: auto, gnu, or llvm (default: auto)])],
            [target_toolchain="$withval"],
            [target_toolchain=auto])

          case "x$target_toolchain" in
            xauto | xgnu | xllvm) ;;
            *) AC_MSG_ERROR([unsupported target toolchain "$target_toolchain"; expected auto, gnu, or llvm]) ;;
          esac
          TARGET_TOOLCHAIN="$target_toolchain"
          AC_SUBST(TARGET_TOOLCHAIN)

          if test "x$target_toolchain" = xllvm; then
            test "x$TARGET_CC" != x || TARGET_CC=clang
            test "x$TARGET_OBJCOPY" != x || TARGET_OBJCOPY=llvm-objcopy
            test "x$TARGET_STRIP" != x || TARGET_STRIP=llvm-strip
            test "x$TARGET_NM" != x || TARGET_NM=llvm-nm
            test "x$TARGET_RANLIB" != x || TARGET_RANLIB=llvm-ranlib

            # Clang needs an explicit target when the build and target differ.
            # Keep caller-supplied -target/--target and linker selections intact.
            if test "x$target_alias" != x; then
              case " $TARGET_CFLAGS " in
                *" --target="* | *" -target "*) ;;
                *) TARGET_CFLAGS="$TARGET_CFLAGS --target=$target_alias" ;;
              esac
              case " $TARGET_CPPFLAGS " in
                *" --target="* | *" -target "*) ;;
                *) TARGET_CPPFLAGS="$TARGET_CPPFLAGS --target=$target_alias" ;;
              esac
              case " $TARGET_CCASFLAGS " in
                *" --target="* | *" -target "*) ;;
                *) TARGET_CCASFLAGS="$TARGET_CCASFLAGS --target=$target_alias" ;;
              esac
              case " $TARGET_LDFLAGS " in
                *" --target="* | *" -target "*) ;;
                *) TARGET_LDFLAGS="$TARGET_LDFLAGS --target=$target_alias" ;;
              esac
            fi
            case " $TARGET_LDFLAGS " in
              *" -fuse-ld="*) ;;
              *) TARGET_LDFLAGS="$TARGET_LDFLAGS -fuse-ld=lld" ;;
            esac
          fi

          #
          # Check for target programs.
          #

          # Find tools for the target.
          '''
          if text.count(needle) != 1:
              raise SystemExit(f'expected one target-tool insertion point, found {text.count(needle)}')
          path.write_text(text.replace(needle, replacement, 1))

          test = Path('tests/whp_llvm_toolchain_config_test.sh')
          test.write_text(r'''#!/bin/sh
          set -eu

          root=$(CDPATH= cd -- "$(dirname -- "$0")/.." && pwd)
          configure_ac="$root/configure.ac"

          check()
          {
              grep -Fq -- "$1" "$configure_ac" || {
                  printf 'missing LLVM target-toolchain contract: %s\n' "$1" >&2
                  exit 1
              }
          }

          check 'AC_ARG_WITH([target-toolchain]'
          check 'xauto | xgnu | xllvm'
          check 'TARGET_CC=clang'
          check 'TARGET_OBJCOPY=llvm-objcopy'
          check 'TARGET_STRIP=llvm-strip'
          check 'TARGET_NM=llvm-nm'
          check 'TARGET_RANLIB=llvm-ranlib'
          check 'TARGET_CFLAGS="$TARGET_CFLAGS --target=$target_alias"'
          check 'TARGET_LDFLAGS="$TARGET_LDFLAGS -fuse-ld=lld"'
          check 'AC_CACHE_CHECK([if compiling with clang]'

          if grep -Fq -- '-Wno-error=unknown-warning-option' "$configure_ac"; then
              printf 'LLVM support must not hide unknown warning options\n' >&2
              exit 1
          fi

          printf 'WHP LLVM target-toolchain source contract: verified\n'
          ''')
          test.chmod(0o755)
          PY

      - name: Run source regression
        shell: bash
        run: tests/whp_llvm_toolchain_config_test.sh

      - name: Install configure dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint bison clang flex gawk gettext \
            help2man lld llvm pkg-config texinfo

      - name: Generate configure
        shell: bash
        run: |
          set -euo pipefail
          SKIP_PO=1 ./bootstrap
          ./configure --help | grep -F -- '--with-target-toolchain=TOOLCHAIN'

      - name: Verify LLVM configure ABI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-llvm wrappers
          ln -sf "$(command -v llvm-nm)" wrappers/whp-nm
          override_nm="$PWD/wrappers/whp-nm"
          (
            cd build-llvm
            TARGET_NM="$override_nm" \
              ../configure \
                --disable-nls \
                --disable-werror \
                --target=i386-none-elf \
                --with-platform=efi \
                --with-target-toolchain=llvm
          )
          grep -Eq '^TARGET_TOOLCHAIN[[:space:]]*=[[:space:]]*llvm$' build-llvm/Makefile
          grep -Eq '^TARGET_CC[[:space:]]*=[[:space:]]*clang$' build-llvm/Makefile
          grep -Eq '^TARGET_OBJCOPY[[:space:]]*=[[:space:]]*llvm-objcopy$' build-llvm/Makefile
          grep -Eq '^TARGET_STRIP[[:space:]]*=[[:space:]]*llvm-strip$' build-llvm/Makefile
          grep -Eq '^TARGET_RANLIB[[:space:]]*=[[:space:]]*llvm-ranlib$' build-llvm/Makefile
          grep -Fq "TARGET_NM = $override_nm" build-llvm/Makefile
          grep -Eq '^TARGET_CFLAGS[[:space:]]*=.*--target=i386-none-elf' build-llvm/Makefile
          grep -Eq '^TARGET_CPPFLAGS[[:space:]]*=.*--target=i386-none-elf' build-llvm/Makefile
          grep -Eq '^TARGET_CCASFLAGS[[:space:]]*=.*--target=i386-none-elf' build-llvm/Makefile
          grep -Eq '^TARGET_LDFLAGS[[:space:]]*=.*--target=i386-none-elf.*-fuse-ld=lld' build-llvm/Makefile

      - name: Verify GCC control configure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-gnu
          (
            cd build-gnu
            CC=gcc TARGET_CC=gcc \
              ../configure \
                --disable-nls \
                --disable-werror \
                --with-platform=emu \
                --with-target-toolchain=gnu
          )
          grep -Eq '^TARGET_TOOLCHAIN[[:space:]]*=[[:space:]]*gnu$' build-gnu/Makefile
          grep -Eq '^TARGET_CC[[:space:]]*=[[:space:]]*gcc$' build-gnu/Makefile

      - name: Commit verified LLVM support
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/whp-llvm-toolchain-repair.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add configure.ac tests/whp_llvm_toolchain_config_test.sh .github/workflows/whp-llvm-toolchain-repair.yml
          git commit -m 'build: add native LLVM target toolchain mode'
          git push origin HEAD:master
